services:
  mariadb:
    image: mariadb:10.11
    container_name: gunbound-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-gunbound}
      MARIADB_DATABASE: ${DB_NAME:-gbth}
      MARIADB_USER: ${DB_USER:-gunbound}
      MARIADB_PASSWORD: ${DB_PASSWORD:-gunbound}
      TZ: America/Sao_Paulo
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --max-connections=200
      - --wait_timeout=28800
      - --interactive_timeout=28800
    volumes:
      - gunbound-mariadb-data:/var/lib/mysql
      - ./src/main/resources/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./scripts/mariadb-init/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - gunbound

  gameserver:
    image: ${GUNBOUND_IMAGE:-ghcr.io/ramondiver/gunbound-java-server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gunbound-server
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8372:8372"
      - "8360:8360"
      - "8352:8352"
      - "8381:8381/udp"
    volumes:
      - ./config:/app/config
      - gunbound-logs:/app/logs
    environment:
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseG1GC -XX:MaxRAMPercentage=75}
    networks:
      - gunbound

networks:
  gunbound:
    driver: bridge

volumes:
  gunbound-mariadb-data:
  gunbound-logs:
