name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (latest, sha, or vX.Y.Z)"
        required: true
        default: latest
  push:
    tags: ["v*"]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout compose files
        uses: actions/checkout@v4

      - name: Resolve image
        id: image
        run: |
          TAG="${{ github.event.inputs.image_tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ghcr.io/ramondiver/gunbound-java-server:${TAG}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/gunbound}"
            IMAGE="ghcr.io/ramondiver/gunbound-java-server:${IMAGE_TAG}"
            mkdir -p "$APP_DIR/config"
            cd "$APP_DIR"

            if [ ! -f docker-compose.yml ]; then
              echo "Missing docker-compose.yml in $APP_DIR — run deploy/remote-setup.sh first"
              exit 1
            fi

            if [ ! -f config/config.properties ]; then
              echo "Missing config/config.properties — copy config.properties.example first"
              exit 1
            fi

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u ramondiver --password-stdin
            fi

            export GUNBOUND_IMAGE="$IMAGE"
            docker compose pull gameserver
            docker compose up -d
            docker compose ps
            docker compose logs --tail=40 gameserver
