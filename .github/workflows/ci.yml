name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build fat JAR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gunbound-server
          path: target/gunbound-server.jar
          if-no-files-found: error
