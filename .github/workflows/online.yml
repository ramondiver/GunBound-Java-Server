name: Online

# GitHub-hosted runners cannot accept inbound GunBound TCP.
# This workflow deploys an always-on Fly.io machine (no VPS to manage).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pom.xml"
      - "Dockerfile.online"
      - "fly.toml"
      - "scripts/online-entrypoint.sh"
      - ".github/workflows/online.yml"

env:
  FLY_APP: gunbound-th-ramondiver

jobs:
  deploy-fly:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    steps:
      - name: Require FLY_API_TOKEN
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "GitHub Actions cannot host GunBound (no public TCP 8372/8360/8352)."
            echo "1. Create a free Fly.io account: https://fly.io/docs/hands-on/sign-up/"
            echo "2. Install flyctl and run: fly auth token"
            echo "3. Repo Settings → Secrets → Actions → New secret FLY_API_TOKEN"
            echo "4. Re-run this workflow (Actions → Online → Run workflow)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Package fat JAR
        run: mvn -B -DskipTests package

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure app + volume + IPv4
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status -a "$FLY_APP" >/dev/null 2>&1; then
            flyctl apps create "$FLY_APP" --org personal || flyctl apps create "$FLY_APP"
          fi
          if ! flyctl volumes list -a "$FLY_APP" | grep -q gunbound_data; then
            flyctl volumes create gunbound_data --region gru --size 1 -a "$FLY_APP" -y
          fi
          flyctl ips allocate-v4 -a "$FLY_APP" || true

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --remote-only -a "$FLY_APP" --dockerfile Dockerfile.online
          echo "==== public addresses ===="
          flyctl ips list -a "$FLY_APP"
          echo "Point the GunBound client broker to that IPv4 on TCP 8372"
